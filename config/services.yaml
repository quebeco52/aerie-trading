# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

    env(SIM_TICK_INTERVAL_US): '100000'
    env(SIM_TICKS_PER_YEAR): '14400'

    # 2. Store them as official app parameters
    app.tick_interval: '%env(int:SIM_TICK_INTERVAL_US)%'
    app.ticks_per_year: '%env(int:SIM_TICKS_PER_YEAR)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        bind:
            $tickIntervalUs: '%app.tick_interval%'
            $ticksPerYear: '%app.ticks_per_year%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    Redis:
        class: Redis
        factory: ['App\Factory\RedisFactory', 'createConnection']

    # Zero-sum industry share ledger persists in Redis; the in-memory store is for tests and harnesses.
    App\Service\Corporate\Industry\IndustryShareStoreInterface:
        alias: App\Service\Corporate\Industry\RedisIndustryShareStore

    # Order flow crosses a process boundary — the web process records fills, the ticker drains them — so
    # Redis is the real store. The in-memory one is for tests and headless harnesses.
    App\Service\Market\Flow\OrderFlowStoreInterface:
        alias: App\Service\Market\Flow\RedisOrderFlowStore

    # The agent book is hot per-tick cache rather than a durable fact about a company, so it lives in Redis
    # alongside the macro state; the in-memory store is for tests and harnesses.
    App\Service\Market\Agent\AgentStateStoreInterface:
        alias: App\Service\Market\Agent\RedisAgentStateStore

    # The desk's option-book exposure is per-tick market state the web process displays and the ticker
    # writes, and every repricing sweep rebuilds it from the chain, so Redis rather than a column.
    App\Service\Market\Gamma\DealerGammaStoreInterface:
        alias: App\Service\Market\Gamma\RedisDealerGammaStore

    # The index membership is frozen between quarterly reconstitutions and read by both the ticker and the
    # pages that list constituents, so it lives in Redis alongside the district roster it mirrors.
    App\Service\Market\Index\IndexMembershipStoreInterface:
        alias: App\Service\Market\Index\RedisIndexMembershipStore
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
