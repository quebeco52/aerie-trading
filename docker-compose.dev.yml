services:
  aerie-caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/app
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aerie-php

  aerie-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aerie-database
      - aerie-redis
  
  aerie-worker:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./:/app
    depends_on:
      - aerie-database
      - aerie-redis
    command: php bin/console messenger:consume async -vv --memory-limit=128M --time-limit=3600
    restart: unless-stopped

  aerie-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    command: php bin/console messenger:consume scheduler_default -vv
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aerie-database
      - aerie-redis
  
  # The Market Ticker
  aerie-ticker:
    profiles: ["live"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: sh -c "sleep 5 && exec php bin/console app:market-ticker --env=prod --no-debug"
    restart: unless-stopped
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aerie-redis
      - aerie-database

  # The Trade Worker
  # aerie-worker:
  #   build:
  #     context: .
  #     dockerfile: docker/php/Dockerfile
  #   command: php bin/console app:trade-worker --env=prod --no-debug
  #   restart: unless-stopped
  #   volumes:
  #     - ./:/app
  #   depends_on:
  #     - aerie-redis
  #     - aerie-database

  # The WebSocket Server
  aerie-websocket:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: php bin/websocket-server.php start
    restart: unless-stopped
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aerie-redis

  aerie-database:
    image: mariadb:11.8
    restart: unless-stopped
    command: 
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=512M
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: symfony_db
      MYSQL_USER: symfony
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  aerie-redis:
    image: redis:8.6-trixie
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
  
volumes:
  caddy_data:
  caddy_config:
  db_data: