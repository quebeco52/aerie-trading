# Production pacing: one simulated year per real week, one tick a second (quarter ~42 h, earnings season ~17 h,
# league season 4 weeks). Set here rather than in any .env file because the dev ticker also runs with --env=prod and
# must keep its own fast clock from .env. Slower: 1209600 ticks a year is a year a fortnight; faster: 302400 is a year
# in 3.5 days. Changing SIM_TICKS_PER_YEAR on a running world: restart the ticker once with --rebase-clock.
x-sim-pace: &sim-pace
  SIM_TICK_INTERVAL_US: "1000000"
  SIM_TICKS_PER_YEAR: "604800"

services:
  aerie-caddy:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aerie-php
    env_file:
      - .env.local

  aerie-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    restart: always
    depends_on:
      - aerie-database
      - aerie-redis
    environment: *sim-pace
    env_file:
      - .env.local

  aerie-worker:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    depends_on:
      - aerie-database
      - aerie-redis
    command: php bin/console messenger:consume async --memory-limit=128M --time-limit=3600
    restart: unless-stopped
    environment: *sim-pace
    env_file:
      - .env.local

  aerie-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    restart: always
    command: php bin/console messenger:consume scheduler_default -vv
    depends_on:
      - aerie-database
      - aerie-redis
    environment: *sim-pace
    env_file:
      - .env.local
  
  aerie-ticker:
    profiles: ["live"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: sh -c "sleep 5 && exec php bin/console app:market-ticker --env=prod --no-debug"
    restart: always
    depends_on:
      - aerie-redis
      - aerie-database
    environment: *sim-pace
    env_file:
      - .env.local

  aerie-websocket:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: php bin/websocket-server.php start
    restart: always
    depends_on:
      - aerie-redis
    env_file:
      - .env.local

  aerie-database:
    image: mariadb:11.8
    restart: always
    env_file:
      - .env.local
    command: 
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=512M
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: symfony_db
      MYSQL_USER: symfony
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  aerie-redis:
    image: redis:8.6-trixie
    restart: always
    env_file:
      - .env.local

volumes:
  caddy_data:
  caddy_config:
  db_data: